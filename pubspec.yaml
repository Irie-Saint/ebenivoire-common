name: ebenivoire_common
description: >-
  Code Flutter commun aux apps EbenIvoire (cliente, vendeur, console) :
  un seul exemplaire, pour que les trois copies ne divergent plus.
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.10.1
  flutter: ">=3.44.0"

# Mêmes contraintes que dans les trois apps : le paquet ne doit jamais forcer
# une montée de version chez l'une d'elles.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  # 12.x dans l'app cliente, 13.x dans les deux autres : les deux conviennent.
  device_info_plus: ">=12.3.0 <14.0.0"
  # Noyau de connexion (appels au serveur, session, jetons) : mêmes
  # contraintes que les trois apps.
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0-beta.5
  get: ^4.7.3
  http_parser: ^4.1.2
  image_picker: ^1.2.0
  intl: ^0.20.2
  # 9.30.0 exactement, comme les apps : 8.x et 9.0 ne compilent pas sur
  # Android (Kotlin 1.6).
  sentry_flutter: 9.30.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
